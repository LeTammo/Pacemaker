services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - ENABLE_AUTO_SYNC=${ENABLE_AUTO_SYNC:-false}
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_INTERNAL_PORT:-3000}"
    env_file:
      - ./.env
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - PORT=${FRONTEND_INTERNAL_PORT:-3000}
